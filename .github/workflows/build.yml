name: Build Windows EXE (Manual)

on:
  workflow_dispatch:
    inputs:
      release_draft:
        description: 'Create a draft GitHub Release with the extracted artifact'
        required: true
        default: false
        type: boolean

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. Check out your repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 4. Install Flutter (Flet uses Flutter under the hood)
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        

      # Build Windows executable
      - name: Build Windows EXE
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
        run: |
          flet build windows

      # 5. List generated files
      - name: List generated files
        if: always()
        shell: pwsh
        run: |
          Write-Host "Generated Windows files:"
          Get-ChildItem -Path build -Recurse -File |
            Select-Object FullName

      # 6. Upload Windows build as GitHub Actions artifact
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnaf-launcher-windows
          path: build/windows/**
          if-no-files-found: error

      # 7. Create a draft GitHub Release
      - name: Create draft GitHub Release
        if: ${{ inputs.release_draft }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-${{ github.run_number }}
          name: FNAF Launcher Windows Build ${{ github.run_number }}
          draft: true
          files: |
            build/windows/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}