name: Build Windows EXE (Manual)

on:
  workflow_dispatch:
    inputs:
      release_draft:
        description: 'Create a draft GitHub Release with the extracted artifact'
        required: true
        default: false
        type: boolean

permissions:
  contents: write # Grants GitHub Token permission to create releases

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. Check out your repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Flutter (Flet uses Flutter under the hood)
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable

      # 3. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Build Windows executable
      - name: Build Windows EXE
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
        run: |
          flet build windows

      # 6. List generated files
      - name: List generated files
        if: always()
        shell: pwsh
        run: |
          Write-Host "Generated Windows files:"
          Get-ChildItem -Path build -Recurse -File |
            Select-Object FullName

      # 7. Zip the entire output folder
      - name: Zip build output
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/*" -DestinationPath "fnaf-launcher-windows.zip" -Force

      # 8. Upload Windows zip as GitHub Actions artifact
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnaf-launcher-windows
          path: fnaf-launcher-windows.zip
          if-no-files-found: error

      # 9. Create a draft GitHub Release
      - name: Create draft GitHub Release
        if: ${{ inputs.release_draft }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-${{ github.run_number }}
          name: FNAF Launcher Windows Build ${{ github.run_number }}
          draft: true
          files: |
            fnaf-launcher-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}